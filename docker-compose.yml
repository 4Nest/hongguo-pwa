# 红果短剧 PWA + Capy Backend 组合部署
# 用法：docker compose up -d
# 取 admin 初始密码：docker exec hongguo cat /app/data/admin-credentials.txt
services:
  capy:
    image: cs920/happy-capy:latest
    container_name: capy
    restart: unless-stopped
    ports:
      - "8788:8788"
    volumes:
      - capy-data:/data
      # 如需自定义配置：把 config.toml 放到 ./capy-config/
      # - ./capy-config:/config
  hongguo:
    image: ghcr.io/4nest/hongguo-pwa:latest
    build: .
    container_name: hongguo
    restart: unless-stopped
    ports:
      - "8789:8789"
    environment:
      UPSTREAM_URL: http://capy:8788
    volumes:
      - hongguo-data:/app/data
    depends_on:
      - capy

volumes:
  capy-data:
  hongguo-data:
